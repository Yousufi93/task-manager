<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <div  class="container">
            <h1> Task Manager </h1>

            <div class="add-task">
                <input 
                    type="text"
                    id="task-input"
                    placeholder="Enter a new task..."
                    >
                <select id="priority-select">
                    <option value="low">🟢 Low</option>
                    <option value="medium" selected>🟡 Medium</option>
                    <option value="high">🔴 High</option>
                </select>
                <button id="add-btn">Add Task</button>
            </div>


        <div class="search-box">
            <input
                type="text"
                id="search-input"
                placeholder="🔍 Search tasks..."
            >

        </div>

        <div class="filters">
            <button class="filter-btn active" data-priority="all">All</button>
            <button class="filter-btn" data-priority="high">🔴 High</button>
            <button class="filter-btn" data-priority="medium">🟡 Medium</button>
            <button class="filter-btn" data-priority="low">🟢 Low</button>
            <button class="sort-btn" id="sort-btn">↕️ Sort by Priority</button>
        </div>
        
        <div class="filters status-filters">
            <button class="status-filter-btn active" data-status="all">📋 All Status</button>
            <button class="status-filter-btn" data-status="done">✔️ Done</button>
            <button class="status-filter-btn" data-status="pending">⏳ Pending</button>
           
        </div>

        
            <table class="task-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Task</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="task-list">
                    <tr>
                        <td>1</td>
                        <td>Sample task</td>
                        <td><span class="status done">Done</span></td>
                        <td>
                            <button class="btn-done">✓</button>
                            <button class="btn-delete">✗</button>           
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <script src="script.js"></script>
    </body>
</html>

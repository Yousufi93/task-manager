<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>

        <div class="login-container" id="login-screen">
            <div class="login-box">
                <h1>🔐 Task Manager</h1>
                <p class="login-subtitle">Please login to continue</p>
                
                <div class="login-tabs">
                    <button class="tab-btn active" id="tab-login">login</button>
                    <button class="tab-btn" id="tab-register">register</button>

                </div>

                <form id="login-form">
                    <input type="text" id="login-username" placeholder="Username" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="submit-btn">login</button>
                    <p class="error-message" id="login-error"></p>
                </form>

                <form id="register-form" style="display: none;">
                    <input type="text" id="register-username" placeholder="Username" required>
                    <input type="password" id="register-password" placeholder="Password (min 6 chars)" required minlength="6">
                    <button type="submit" class="submit-btn">register</button>
                    <p class="error-message" id="register-error"></p>
                </form>

            </div>
        </div>



        <div  class="container" id="app-screen" style="display: none;">
            <h1> Task Manager </h1>

            <div class="add-task">
                <input 
                    type="text"
                    id="task-input"
                    placeholder="Enter a new task..."
                    >
                <select id="priority-select">
                    <option value="low">🟢 Low</option>
                    <option value="medium" selected>🟡 Medium</option>
                    <option value="high">🔴 High</option>
                </select>
                <button id="add-btn">Add Task</button>
            </div>


        <div class="search-box">
            <input
                type="text"
                id="search-input"
                placeholder="🔍 Search tasks..."
            >

        </div>

        <div class="filters">
            <button class="filter-btn active" data-priority="all">All</button>
            <button class="filter-btn" data-priority="high">🔴 High</button>
            <button class="filter-btn" data-priority="medium">🟡 Medium</button>
            <button class="filter-btn" data-priority="low">🟢 Low</button>
            <button class="sort-btn" id="sort-btn">↕️ Sort by Priority</button>
            <button class="clear-btn" id="clear-btn">🗑️ Clear All</button>
        </div>
        
        <div class="filters status-filters">
            <button class="status-filter-btn active" data-status="all">📋 All Status</button>
            <button class="status-filter-btn" data-status="done">✔️ Done</button>
            <button class="status-filter-btn" data-status="pending">⏳ Pending</button>
           
        </div>

        
            <table class="task-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Task</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="task-list">
                    <tr>
                        <td>1</td>
                        <td>Sample task</td>
                        <td><span class="status done">Done</span></td>
                        <td>
                            <button class="btn-done">✓</button>
                            <button class="btn-delete">✗</button>           
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <script src="script.js"></script>
    </body>
</html>
